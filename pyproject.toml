[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citizenship-search-app"
version = "0.1.0"
description = "Discovery-first family search app for Polish citizenship evidence gathering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
citizenship-search = "citizenship_search.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
